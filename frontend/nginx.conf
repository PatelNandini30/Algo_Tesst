worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    # Gzip compression — reduces JSON payloads by ~80%
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_types application/json text/plain text/css application/javascript;

    # Rate limits for different workflows
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_backtest:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_upload:10m rate=2r/s;

    # Docker service IPs can change when containers are rebuilt. Use Docker's
    # embedded DNS resolver with a variable proxy target so nginx re-resolves
    # backend instead of holding a stale container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 3000;
        server_name _;
        set $backend_upstream http://backend:8000;
        client_max_body_size 50M;
        client_body_buffer_size 1M;
        root /usr/share/nginx/html;
        index index.html;

        location ~* \.(js|css|png|jpg|ico|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /api/intraday/ {
            set $intraday_upstream http://intraday-api:8001;
            limit_req zone=api_backtest burst=20 nodelay;
            proxy_pass $intraday_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        location /api/backtest {
            limit_req zone=api_backtest burst=20 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        location /api/upload {
            limit_req zone=api_upload burst=5 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        location /api/ {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        location /str-segments {
            proxy_pass $backend_upstream/api/str-segments;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /filter-segments {
            proxy_pass $backend_upstream/api/filter-segments;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # index.html must NEVER be cached — it references content-hashed JS/CSS
        # bundles. If the browser caches index.html it keeps loading stale (old
        # hash) assets forever even after a redeploy. no-store forces a fresh
        # fetch every load so new builds are picked up immediately.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires off;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
    }
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maintenance — AlgoTest</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
      background: #12121a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(251,191,36,0.06);
      max-width: 480px;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      animation: spin 3s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #fbbf24;
      margin-bottom: 0.75rem;
      letter-spacing: 0.02em;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.7;
    }
    .dot-loader {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 2rem;
    }
    .dot-loader span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
    .dot-loader span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1;   }
    }
  </style>
  <script>
    // Auto-reload when backend comes back up
    setInterval(() => {
      fetch('/health').then(r => { if (r.ok) location.reload(); }).catch(() => {});
    }, 5000);
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">⚙️</div>
    <h1>System Maintenance</h1>
    <p>AlgoTest is being updated and will be back shortly.<br>This page will reload automatically when ready.</p>
    <div class="dot-loader">
      <span></span><span></span><span></span>
    </div>
  </div>
</body>
</html>

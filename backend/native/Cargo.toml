[package]
name = "algotest_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "algotest_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py311"] }
once_cell = "1.19"
memmap2 = "0.9"
chrono = { version = "0.4", features = ["clock"] }
arrow-array = "52"
arrow-ipc = "52"
arrow-schema = "52"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ahash = "0.8"
rayon = "1.10"
num_cpus = "1.16"

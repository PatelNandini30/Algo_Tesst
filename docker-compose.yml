# ============================================================
# Tuned for: Dell Pro Tower QCT1250  (migrated from HP 280 Pro G6 in 2026-06)
#   CPU  : Intel Core i5-14500  (14C/20T, 20 logical CPUs)
#   RAM  : 16 GB DDR5  (≈14.8 GiB usable) — FIXED, no upgrade planned.
#          Board has 2 DDR5 UDIMM slots / max 64 GB, but the user is staying at
#          16 GB, so the budget below MUST live within ~14.8 GiB RAM + swap.
#   DISK : KIOXIA 512 GB NVMe SSD  ← SSD now, NOT a spinning HDD.
#   OS   : Ubuntu 26.04 (Linux 7.0)
#   Swap : 24 GB on the NVMe SSD  ← safe to use as overflow (SSD, ~100x faster
#          than the old HDD). This swap is the cushion that absorbs the
#          intentional overcommit below; it is NOT off-limits like the old HDD swap.
#
# *** MEMORY REALITY ON THIS 16 GB BOX — READ BEFORE CHANGING LIMITS ***
#   The hard limits below SUM TO ~17,400M (default stack) and therefore
#   intentionally OVERCOMMIT the 14.8 GiB of RAM. This is only safe because:
#     (a) the two 5 GB backtest workers each hold ~3.9 GB just for their own
#         Rust/Arrow NIFTY cache (much of it mmap'd, cheap to page from SSD), and
#         a solo user rarely runs a heavy job on BOTH at the same instant; and
#     (b) the 24 GB SSD swap absorbs any spillover cheaply.
#   The old HDD machine froze (swap thrash) when this overcommit hit; on the new
#   NVMe SSD the same pressure degrades gracefully instead of rebooting the PC.
#
#   *** NO-OOM ENFORCEMENT (added 2026-06): a memory ADMISSION GATE now bounds
#   the combined memory of concurrently *active* heavy jobs to HEAVY_MEMORY_BUDGET_MB
#   (7000M). A job that doesn't fit WAITS (status "queued") instead of overcommitting.
#   So the per-container limits above are ceilings, but the gate is what actually
#   keeps the live working set within RAM. The old "RULE: don't run optimize + two
#   backtests" is now ENFORCED by the gate, not left to the user. Idle warm caches
#   page to SSD swap and don't count against the active budget.
#   FAST_LOOKUP_MODE=rust is on: lookups are Rust-only (no Python dict fallback);
#   the gate + swap are the memory backstop for the uncapped native cache load.
#   See services/memory_gate.py. Retune via HEAVY_* env vars; revert with
#   HEAVY_MEMORY_GATE=0 and FAST_LOOKUP_MODE=auto.
#
# Per-container hard limits (default stack):
#   postgres                       : 3500M
#   redis                          :  700M
#   backend                        : 6000M  (temporarily raised 2026-07-13 from 2500M —
#                                    a full-history feather rebuild, e.g. NIFTY back to
#                                    2008, needs more than 2500M of raw Pandas/merge
#                                    working memory before it compacts into the Arrow
#                                    feather; confirmed via dmesg cgroup-OOM kills at
#                                    2500M. Revert to 2500M once no longer needed for
#                                    wide historical rebuilds — normal request-serving
#                                    doesn't need this much.)
#   worker-backtests               : 5000M  (own ~3.9 GB Rust cache)
#   worker-backtests-fast          : 5000M  (own ~3.9 GB Rust cache)
#   worker-uploads                 :  500M
#   frontend                       :  200M
#   ───────────────────────────────────────
#   Sum (default stack)            : 20,900M   (+13,000M when worker-optimize active)
#   Host RAM                       : ~15,160M (14.8 GiB)
#   → The default stack overcommits modestly; the optimize worker (profile-gated)
#     adds 13,000M when running 3 concurrent optimize jobs (concurrency=3, P=2;
#     raised from 2 jobs / 10,000M on 2026-07-04 at the user's request).
#     This deliberately overcommits 16 GB onto the 24 GB NVMe swap. The memory
#     ADMISSION GATE (HEAVY_MEMORY_BUDGET_MB=11000) bounds total ACTIVE heavy
#     work — target concurrency is 2 optims + 1 backtest:
#       2 optims (P=3, ~4100 each) + 1 backtest (~2700) = 10,900  -> all run
#       a 3rd optim (~12,300) does NOT fit -> QUEUES (status "queued")
#
#     LOWERED 19000 -> 11000 on 2026-07-17. The old 19000 could not queue at all:
#     it sat ABOVE worker-optimize's own 12.7 GiB cgroup limit, so the kernel
#     always SIGKILLed a child before the gate ever filled (WorkerLostError:
#     signal 9). Its "3 optims (3x4500=13,500)" arithmetic ALSO exceeded that
#     same 12.7 GiB cgroup. The 4500/optim figure assumed single-index; a
#     multi-index sweep measured ~11,000 MB. Keep this budget BELOW the
#     worker-optimize cgroup limit or the gate is decorative.
#     Cost model note: reservations now scale by FORK WIDTH (parallelism), not
#     date span — see memory_gate._PER_CHILD_MB. A 2nd concurrent backtest QUEUES — so the
#     overcommit can never exhaust RAM+swap (no OOM). All workers mmap-SHARE one
#     copy of the OHLC feather, so real RAM is far below the per-container sums.
#     (concurrency=3 is the hard cap on simultaneous optimize jobs; a 4th waits
#     in the 'optimize' queue. A heartbeat WATCHDOG auto-cancels any job stuck
#     with no progress >OPTIMIZE_STUCK_SECONDS — see services/optimizer/watchdog.py.)
#     (Intraday is a separate product — its workers/api + the intraday-only
#     cron-warmup were removed, reclaiming ~4.5 GB for this headroom.)
#
# SSD-specific Postgres tuning (was HDD-tuned before the 2026-06 migration):
#   - random_page_cost=1.1   (NVMe random reads are ~as cheap as sequential)
#   - effective_io_concurrency=200  (SSD does deep parallel I/O; the HDD could not)
#   - shared_buffers=512MB / effective_cache_size=2GB  (kept modest — only 16 GB RAM)
#   - work_mem=32MB, max_parallel_workers=2  (kept low to protect the RAM budget,
#     not because of disk — CPU now has 20 threads to spare)
#
# *** LAN REMOTE WORKERS (added 2026-07): other in-house PCs can run the
#   remote-worker/ package (a Celery worker container joining THIS box's
#   Redis broker + Postgres over the LAN) to contribute their own separate
#   CPU/RAM to optimize/backtest jobs. See services/node_registry.py and
#   services/memory_gate.py (per-node budget — a remote node's memory-gate
#   budget comes from ITS OWN reported RAM, not this box's HEAVY_MEMORY_BUDGET_MB,
#   so remote jobs never compete with the local budget above). Redis/Postgres
#   already publish on 0.0.0.0 below, so no networking change was needed here —
#   only max_connections was raised (50→100) for the extra worker pools, which
#   is a negligible (~KB range) memory cost and does NOT change the RAM budget
#   math above. No auth was added (trusted in-house LAN, by user's explicit
#   choice) — do not expose these ports outside the LAN.
# ============================================================

x-backend-env: &backend-env
  DATABASE_URL: "postgresql://${POSTGRES_USER:-algotest}:${POSTGRES_PASSWORD:-algotest_password}@postgres:5432/${POSTGRES_DB:-algotest}"
  REDIS_URL: "redis://redis:6379/0"
  DATA_DIR: /data
  PYTHONUNBUFFERED: "1"
  MALLOC_ARENA_MAX: "2"
  DB_POOL_SIZE: "5"
  DB_POOL_MAX_OVERFLOW: "5"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "3600"
  # Cap in-process bulk_load so backend+worker never OOM on 16GB HDD server
  BULK_LOAD_MAX_MEMORY_MB: "1500"
  # Max Rust AHashMap cache size (feather_MB × 5 estimate). Raised to 4000 on
  # 2026-05-25 because the FUTURES port grew the feather from ~575 MB → 706 MB;
  # 706×5=3530 MB exceeds the old 3000 MB cap, causing the Rust cache to be
  # skipped → Python/Polars fallback → 7 GB host swap and stuck optimize jobs.
  # Pair with worker-optimize mem_limit (see budget header). f32 cache ~2.6 GB.
  RUST_CACHE_MAX_MEMORY_MB: "4000"
  # NIFTY bulk loads are narrow (date/expiry/type/strike/close), so avoid
  # splitting normal 6-7 year backtests into repeated DB+engine passes.
  BULK_LOAD_CHUNK_YEARS: "10"
  # Keep startup responsive on HDD. Real backtest requests load their own range.
  PREBUILD_BULK_OPTIONS: "0"
  # Warm enough history to cover the long 2019+ runs used by the team.
  PREBUILD_WARM_YEARS: "8"
  # Tradesheet includes MAE/MFE by default; set to 0 only for bulk performance tests.
  BACKTEST_INCLUDE_MAE_MFE: "1"
  # Build the combo tradesheet workbook in Rust (all 4 sheets in one native call).
  # Cell-identical to the openpyxl path (tools/workbook_verify: 0 diffs, plain+midcap);
  # 1.8-2.7x faster, scales with trade count. Set to 0 to revert to openpyxl rendering.
  OPTIMIZE_RUST_XLSX: "1"
  # Persist hot caches across container recreates.
  PARQUET_CACHE_DIR: /data/cache/parquet
  ALGO_RUST_CACHE_DIR: /data/cache/arrow
  # FAST_LOOKUP_MODE=rust: strict Rust-only lookups. The native cache is ALWAYS
  # built and NEVER falls back to the Python dict — a missing/unbuildable native
  # cache raises a clear error instead of silently running the slow path. Memory
  # safety comes from the admission gate below + SSD swap, not from skipping to
  # Python. Set back to 'auto' to restore Rust-preferred + Python fallback.
  FAST_LOOKUP_MODE: rust
  FAST_LOOKUP_MIN_YEARS: "2.0"
  FAST_LOOKUP_RANGE_FILTER: "0"
  FAST_LOOKUP_NATIVE_SCANS: "1"
  # ── Memory admission gate (no-OOM) ──────────────────────────────────────────
  # Bounds the combined memory of concurrently *active* heavy jobs so they can
  # never overcommit RAM. A job that doesn't fit waits (status shows "queued")
  # until a running job releases its slot. Idle warm caches page to SSD swap and
  # don't count. Pure orchestration — see services/memory_gate.py (no math touched).
  HEAVY_MEMORY_GATE: "1"
  # Sized for: 3 concurrent optimize jobs (@ ~4500 each, P=2) = 13500 PLUS one
  # backtest (5000) = 18500 ≤ 19000, so a backtest can ALWAYS run alongside the
  # 3 optims (it never queues behind them). The hard cap on simultaneous optims
  # is the worker's concurrency=3, not the gate. A *second* concurrent backtest
  # (→23500) would queue — acceptable. 24 GB NVMe swap is the final backstop;
  # real RAM is well under 18500 because all workers mmap-SHARE one copy of the
  # OHLC feather (only the per-job f32 AHashMap ~2.6 GB is duplicated). Raised
  # 14000→19000 on 2026-07-04 so 3 optims + 1 backtest coexist per user request.
  # 12500 (was 11000): sized for the target mix of 2 optims + 1 backtest.
  #   2 optims @ P=6 (1500 base + 150/yr*7.5 + 5*300) = 4125 each = 8250
  #   + 1 backtest (~3873 for a 7.5y span)            = 12123  -> fits
  # At 11000 the backtest QUEUED behind two optims, which is the exact
  # combination the user wants to run concurrently. Still below the
  # worker-optimize cgroup limit (12.7 GiB) so the gate stays enforceable.
  # Actual measured usage for that mix is ~9.6 GB, so this reserves ~1.3x.
  HEAVY_MEMORY_BUDGET_MB: "12500"
  # RAM kept free for the DESKTOP and OS at all times. Both the admission gate
  # and the fork-width cap subtract this before deciding anything, so the
  # optimizer physically cannot fork wide enough to leave the machine short.
  # Raised 1500 -> 2500 alongside OPTIMIZE_PARALLELISM 6 -> 12: twice the
  # children means the width cap must protect a bigger cushion, and this box
  # is someone's DESKTOP (a full-swap episode on 2026-08-06 OOM-killed
  # LibreOffice and two Chrome processes). Cost: sweeps narrow a little
  # sooner when RAM is tight -- deliberate, the user does not want lag.
  HEAVY_GATE_LIVE_RAM_FLOOR_MB: "2500"
  HEAVY_COST_BACKTEST_MB: "5000"
  HEAVY_COST_OPTIMIZE_MB: "4500"          # one optimize job at P=2 (was 6000 at P=6)
  # ── Cost model re-based on MEASUREMENT (2026-08-05) ─────────────────────────
  # Measured on a live P=6, 7.3-year sweep (/proc smaps_rollup + cgroup total):
  #     parent            505 MB PSS
  #     each child        589 MB PSS,  251 MB PRIVATE  <- true marginal cost
  #     whole job         2.81 GB (cgroup, sharing accounted)
  # The old model priced that same job at 9,746 MB — 3.5x over — so ONE optim ate
  # 89% of the budget and every backtest queued behind it ("budget busy") even
  # though the box was mostly free. The per_year term was the main error: it dates
  # from when option data sat in Python dicts, but the feather is now mmap-SHARED
  # across all workers, so extra years cost almost no anonymous memory.
  # New values keep a ~1.4x margin over measurement and let the intended mix run:
  #     2 optims @P=3 (2 x 3,195) + 1 backtest 7.3y (3,825) = 10,215 <= 11,000
  #     1 optim  @P=6 (4,095)     + 1 backtest 7.3y (3,825) =  7,920 <= 11,000
  # Re-measure before lowering further; raising is always safe.
  HEAVY_COST_OPTIMIZE_BASE_MB: "1500"      # parent + engine overhead (measured ~505 MB PSS)
  HEAVY_COST_OPTIMIZE_PER_YEAR_MB: "150"   # was 500 — data is mmap-shared, not per-job
  HEAVY_COST_BACKTEST_PER_YEAR_MB: "250"   # was 430 — warm backtest worker measured ~3.1 GB
  HEAVY_GATE_WAIT_MAX_SECONDS: "600"      # then proceed anyway (SSD swap backstop)
  HEAVY_RESERVATION_TTL_SECONDS: "2400"   # auto-reclaim a crashed/cancelled slot
  # Route small ranges to a separate worker so they do not wait behind a long run.
  BACKTEST_FAST_QUEUE_MAX_DAYS: "550"
  # API warm-cache waits for the Celery worker cache, not only backend memory.
  WARM_CACHE_WAIT_SECONDS: "90"
  # Try Rust engine for supported strategies (slices 1-5); auto-falls back to
  # Python for buffer/futures/lazy/rollover/no-rollover/min_days/fixed-mode legs.
  ENGINE_BACKEND: "rust"
  # General mixed OPTIONS+FUTURES: options through the normal Rust pipeline,
  # futures Rust-priced from the FUTIDX feather, unit-exit at the option's
  # current expiry. Verified trade-by-trade vs the Python engine (0 mismatches).
  # unset/0 = old behavior (option leg dropped in the plain-mixed case); '1' =
  # Rust-authoritative mixed path; 'shadow' = build+log only. See
  # services/engine_rust.py::_build_mixed_futures_options.
  MIXED_FUT_RUST: "1"

x-backend-volumes: &backend-volumes
  - ./cleaned_csvs:/data/cleaned_csvs:ro
  - ./expiryData:/data/expiryData:ro
  - ./strikeData:/data/strikeData:ro
  - ./Filter:/data/Filter:ro
  - algo_cache:/data/cache
  # Bind-mount backend source so .py edits on host hot-reload into containers
  # without rebuilding the image. The Rust extension is loaded from
  # /usr/local/lib/python3.11/site-packages, not from /app/native, so this is safe.
  - ./backend:/app

services:
  postgres:
    image: postgres:15-bullseye
    container_name: algotest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algotest}
      POSTGRES_USER: ${POSTGRES_USER:-algotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algotest_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./reports/sql:/data:ro
    shm_size: '512mb'
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_worker_processes=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_workers=2
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
      -c log_min_duration_statement=2000
      -c idle_in_transaction_session_timeout=600000
      -c statement_timeout=1800000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algotest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3500M
          cpus: "2.0"
        reservations:
          memory: 1500M
    networks:
      - algotest-network

  redis:
    image: redis:7-bullseye
    container_name: algotest-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 500mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-keepalive 60
      --timeout 0
    environment:
      REDIS_PASSWORD: ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 700M
          cpus: "0.5"
        reservations:
          memory: 64M
    networks:
      - algotest-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # provenance attestation is a Docker Hub SBOM feature; locally it
      # adds 5-7 minutes to every rebuild and we don't use it. Off.
      provenance: false
    image: algotest-backend-app:latest
    container_name: algotest-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command:
      - granian
      - --interface
      - asgi
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"
      - --loop
      - uvloop
      - main:app
    environment:
      <<: *backend-env
      DB_STATEMENT_TIMEOUT: "1800000"
      USE_POSTGRESQL: "true"
      ALLOW_CSV_FALLBACK: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-algotest}
      POSTGRES_USER: ${POSTGRES_USER:-algotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algotest_password}
      OPTIMIZE_PARALLELISM: "2"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health'); print(r.read())"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 6000M
          cpus: "2.0"
        reservations:
          memory: 256M
    networks:
      - algotest-network

  worker-backtests:
    image: algotest-backend-app:latest
    container_name: algotest-worker-backtests
    restart: unless-stopped
    # Recycle workers by TASK COUNT, not just RSS. --max-memory-per-child measures
    # RESIDENT memory, so once an idle worker's heap is swapped out its RSS falls
    # below the limit and the check can never fire — that is how 24 GB of swap
    # filled with idle worker heaps, which then cgroup-OOM-killed a pool child and
    # wedged a sweep at 160/648. Task-count recycling is immune to swapping.
    command: >
      celery -A worker.celery worker
      --queues=backtests
      --concurrency=1
      -l info
      --max-tasks-per-child=1
      --max-memory-per-child=5000000
      --without-gossip
      --without-mingle
      --without-heartbeat
    environment:
      <<: *backend-env
      BACKTEST_WORKERS: "1"
      BULK_LOAD_MAX_MEMORY_MB: "1500"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 5000M
          cpus: "4.0"
        reservations:
          memory: 512M
    networks:
      - algotest-network

  worker-backtests-fast:
    image: algotest-backend-app:latest
    container_name: algotest-worker-backtests-fast
    restart: unless-stopped
    # Recycle workers by TASK COUNT, not just RSS. --max-memory-per-child measures
    # RESIDENT memory, so once an idle worker's heap is swapped out its RSS falls
    # below the limit and the check can never fire — that is how 24 GB of swap
    # filled with idle worker heaps, which then cgroup-OOM-killed a pool child and
    # wedged a sweep at 160/648. Task-count recycling is immune to swapping.
    command: >
      celery -A worker.celery worker
      --queues=backtests_fast
      --concurrency=1
      -l info
      --max-tasks-per-child=25
      --max-memory-per-child=5000000
      --without-gossip
      --without-mingle
      --without-heartbeat
    environment:
      <<: *backend-env
      BACKTEST_WORKERS: "1"
      BULK_LOAD_MAX_MEMORY_MB: "900"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 5000M
          cpus: "2.0"
        reservations:
          memory: 256M
    networks:
      - algotest-network

  worker-optimize:
    # Profile-gated: not started by `docker compose up`. Bring up with:
    #   docker compose --profile optimize up -d worker-optimize
    # Shares the same image as worker-backtests; runs an exclusive 'optimize' queue
    # so long parameter sweeps don't block normal backtests.
    #
    # concurrency=3: THREE optimize jobs at a time (results stay isolated per
    # job_id — separate processes, separate optim:{job_id}:* keys + trade dirs).
    # In-job parallelism = OPTIMIZE_PARALLELISM=2 so 3 jobs ≈ the same ~6
    # combos-in-flight as the old 2×3 config (CPU-neutral). Per-job memory at
    # P=2 (billiard fork + CoW sharing):
    #   - Rust AHashMap (f32): ~2.6 GB  (per JOB — duplicated across the 3 jobs)
    #   - pandas ohlc_df_pandas: ~75 MB (CoW-inherited by workers)
    #   - Python/Celery overhead: ~500 MB
    #   - 2 workers × ~400 MB private pages: ~0.8 GB
    #   - Per job ≈ 3.9 GB → 3 jobs ≈ 11.7 GB (OHLC feather is mmap-shared, +~0.5)
    # mem_limit 13000M holds all three (clean mmap pages reclaim + anonymous
    # spill to the 24 GB NVMe swap under pressure; cgroup won't OOM a job). The
    # memory gate + concurrency=3 cap total ACTIVE heavy work so it can never
    # exhaust swap. Runs under the idle-aware reload supervisor (see command).
    # A heartbeat watchdog auto-cancels any job stuck with no progress.
    profiles: ["optimize"]
    image: algotest-backend-app:latest
    container_name: algotest-worker-optimize
    restart: unless-stopped
    # Run under the idle-aware hot-reload supervisor (worker/dev_supervisor.py):
    # it launches the Celery worker below and, when a bind-mounted *.py changes,
    # restarts the worker ONLY while it is idle — new runs pick up new code with
    # NO image rebuild, and an actively-running job is never disturbed. The real
    # Celery command lives in RELOAD_CHILD_CMD.
    command:
      - python
      - -m
      - worker.dev_supervisor
    environment:
      <<: *backend-env
      # PYTHONOPTIMIZE=1 (override): the base image sets =2 (strips docstrings)
      # which breaks the `cma` library that nevergrad lazy-imports for
      # CMA-ES / PSO / GA optimization methods. =1 still strips asserts (same
      # behavior as today) but keeps docstrings so cma's module-level
      # `plot.__doc__.split(...)` doesn't crash. Smart-sampler optims would
      # crash with `'NoneType' object has no attribute 'split'` otherwise.
      PYTHONOPTIMIZE: "1"
      BACKTEST_WORKERS: "1"
      OPTIMIZE_MAX_COMBOS: "100000"
      # SOLO CEILING (full-box parallelism when ONE optim runs). The runner
      # (services/optimizer/runner.py) treats this as the max and DYNAMICALLY
      # divides it by the number of optims computing right now (live-optim
      # registry in result_store.py):
      #     1 optim live  -> P=12 (fills the 12-cpu quota)
      #     2 optims live -> P=6 each (12 total — no oversubscribe)
      # RAISED 6 -> 12 on 2026-08-07 from measurement: a live P=6 sweep used
      # 605% CPU, i.e. ~1 core per child, NOT the 2 this comment assumed from
      # RUST_SIM_THREADS=2. So P=6 filled only half the 12-cpu quota and left
      # the box at ~30% utilisation while a 14,400-combo sweep ran for 80 min.
      # If a future workload really does use 2 threads/combo, P=12 oversubscribes
      # the quota — the cgroup THROTTLES (slower), it does not OOM, so this
      # degrades gracefully rather than breaking.
      # Still fully DYNAMIC: this is only the ceiling; split_width() divides it
      # by live optims and re-caps against free RAM at every batch boundary.
      # So a lone optim gets the whole box for max speed, but two never exceed
      # the single-optim CPU/RAM envelope. concurrency=2 caps optims at 2, so P
      # is only ever 6 or 3. Memory (feather ~2.6 GB is mmap-SHARED across all
      # workers of all optims via the OS page cache; only ~0.5 GB parent +
      # ~0.7 GB/worker is private): 1×P6 ≈ 7.6 GB, 2×P3 ≈ 8.1 GB — both under
      # the 13 GB limit, leaving room for a concurrent backtest (~2.6 GB) with
      # no OOM. Re-tuned 2026-07-06 for "max 2 optims, full speed when alone,
      # dynamic split when two, never OOM" (per user).
      OPTIMIZE_PARALLELISM: "12"
      # Per-child PRIVATE memory used by the live-RAM fork-width cap in
      # services/optimizer/parallel.py (cap_parallelism_for_live_ram). Distinct
      # from HEAVY_COST_OPTIMIZE_PER_CHILD_MB, which sizes the GATE reservation.
      # It was unset and defaulting to 700 MB, so with ~5 GB free the cap computed
      # (5000-1500)/(700*2) = 2 and pinned two sweeps at P=2 regardless of the
      # ceiling. Measured private per child: 91 MB single-index, 225 MB multi-index
      # (compose header, post pre-fork overlay merge). 300 keeps a 1.3-3x margin.
      OPTIMIZE_WORKER_PRIVATE_MB: "300"
      # Hard cap on optims running AT THE SAME TIME. Arrivals beyond this wait
      # before registering or reserving anything, so a queued job costs nothing
      # and — critically — does not appear in the divisor that sizes the running
      # sweeps' fork width. Without the cap a 3rd request made both running jobs
      # collapse to P=1 while it sat there holding no memory at all.
      # 2 is the tuned pairing above: 2×P3 ≈ 8.1 GB, leaving room for a backtest.
      OPTIMIZE_MAX_CONCURRENT: "2"
      # Marginal PRIVATE memory per forked optimize child — the gate multiplies
      # this by (P-1) so a reservation tracks fork width, not just date span.
      # 700 MB is the "~0.7 GB/worker is private" figure measured just above (the
      # ~2.6 GB feather is mmap-SHARED and already covered by the base cost).
      # The default (400) under-reserved a P=6 multi-index sweep badly enough that
      # two of them were admitted together — 9 live children in a 12.7 GiB cap —
      # and the cgroup OOM-killed one mid-run (2026-08-01). Lower this only with a
      # fresh measurement; raising it just makes wide sweeps queue instead of race.
      # 300 MB, from measurement: a live P=6 sweep showed 251 MB PRIVATE per child
      # (589 MB PSS, but PSS double-counts the mmap-shared feather). 700 was a
      # guess taken from a stale comment and over-reserved the budget 3.5x, which
      # is what starved every backtest into "budget busy".
      HEAVY_COST_OPTIMIZE_PER_CHILD_MB: "300"
      # Inline finalization OFF: doing patchwise XLSX + metrics + WOW/MOM per
      # combo across many parallel workers saturates RAM/CPU (36x sweep inflation)
      # — build them once at finalization instead.
      OPTIMIZE_INLINE_FINALIZE: "0"
      # ── Stuck-job watchdog (services/optimizer/watchdog.py) ──────────────────
      # Runs as a daemon thread in THIS worker (guard = OPTIMIZE_WATCHDOG). It
      # auto-cancels any optimize job whose progress heartbeat freezes for
      # >OPTIMIZE_STUCK_SECONDS (a real hang) — a job that is still progressing
      # is never touched. This is what guarantees the 2026-07-04 6h finalization
      # hang can never recur. Checked every OPTIMIZE_WATCHDOG_INTERVAL seconds.
      OPTIMIZE_WATCHDOG: "1"
      OPTIMIZE_STUCK_SECONDS: "9000"        # 2.5h with no progress → cancel
      OPTIMIZE_WATCHDOG_INTERVAL: "300"     # scan every 5 min
      # ── Idle-aware hot reload (worker/dev_supervisor.py) ─────────────────────
      # The supervisor (container command) runs this Celery worker and restarts
      # it when bind-mounted code changes, but only while idle. concurrency=2 =
      # at most TWO optimize jobs at once (results isolated per job_id); the
      # dynamic P split (OPTIMIZE_PARALLELISM above) keeps two from thrashing
      # CPU or RAM. A 3rd queued optim waits for a free slot.
      RELOAD_ENABLE: "1"
      RELOAD_WATCH_DIR: "/app"
      RELOAD_POLL_SECONDS: "3"
      RELOAD_CHILD_CMD: >-
        celery -A worker.celery worker
        --queues=optimize
        --concurrency=2
        -l info
        --max-tasks-per-child=1
        --max-memory-per-child=5000000
        --without-gossip
        --without-mingle
        --without-heartbeat
      # Keep MAE/MFE enabled so optimizer master-summary "Actual Live DD"
      # matches the downloaded tradesheet Summary sheet. If disabled, optimizer
      # summary falls back to booked DD/%DD while tradesheet downloads are
      # enriched later, causing the two summaries to disagree.
      OPTIMIZE_SKIP_MAE_MFE: "0"
      OPTIMIZE_SKIP_TRADESHEETS: "0"
      FAST_LOOKUP_RANGE_FILTER: "0"
      # Fork-safe threading for the optimizer worker.
      # POLARS_MAX_THREADS=1: keep Polars single-threaded in the parent so
      # its global rayon pool has ≤1 thread before forking — Polars ops in
      # children degrade gracefully to sequential rather than deadlocking.
      # RUST_SIM_THREADS=4: thread count for the process-local rayon pools
      # (SIM_POOL in simulate.rs, OPTIM_POOL in optimizer.rs). These pools
      # are Lazy<ThreadPool> singletons that are NOT initialized in the parent
      # — each forked child creates its own fresh pool on first use, so there
      # are no dead inherited threads. RAYON_NUM_THREADS is intentionally
      # unset; the global rayon pool is never used by the engine.
      POLARS_MAX_THREADS: "1"
      RUST_SIM_THREADS: "2"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # 13000M: holds THREE concurrent optimize jobs at P=2. Each job ≈ 3.9 GB
          # (f32 AHashMap ~2.6 GB + Python/Celery ~0.5 GB + 2 workers × 0.4 GB),
          # the OHLC feather is mmap-shared (counted once) → ~12 GB + headroom.
          # Anonymous spillover pages to the 24 GB NVMe swap under pressure; the
          # memory admission gate (HEAVY_MEMORY_BUDGET_MB) + concurrency=3 cap
          # keep the ACTIVE set bounded so the cgroup never OOM-kills a job.
          # cpus 12.0: 3 jobs × 2 billiard workers + parents; ~8 threads left for
          # backend/postgres on the 20-thread i5-14500. Updated 2026-07-04.
          memory: 13000M
          cpus: "12.0"
        reservations:
          memory: 256M
    networks:
      - algotest-network

  worker-uploads:
    image: algotest-backend-app:latest
    container_name: algotest-worker-uploads
    restart: unless-stopped
    command: >
      celery -A worker.celery worker
      -Q uploads
      -c 1
      -l info
      --max-memory-per-child=300000
      --without-gossip
      --without-mingle
      --without-heartbeat
    environment:
      <<: *backend-env
    volumes:
      - ./cleaned_csvs:/data/cleaned_csvs:ro
      - ./expiryData:/data/expiryData:ro
      - ./strikeData:/data/strikeData:ro
      - ./Filter:/data/Filter:ro
      - algo_cache:/data/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 500M
          cpus: "0.5"
        reservations:
          memory: 128M
    networks:
      - algotest-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algotest-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pkill -0 nginx || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "0.5"
        reservations:
          memory: 64M
    networks:
      - algotest-network

volumes:
  pgdata:
  redis_data:
  parquet_cache:
  algo_cache:

secrets:
  ca_bundle:
    file: /etc/ssl/certs/ca-certificates.crt

networks:
  algotest-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================
# Tuned for: HP 280 Pro G6 Microtower
#   CPU  : Intel i5-10500  (6C/12T, 3.1–4.5 GHz)
#   RAM  : 16 GB DDR4-3200 (2×8 GB)
#   DISK : 1 TB TOSHIBA DT01ACA1  ← spinning HDD, NOT SSD
#   OS   : Ubuntu (Linux)
#   Swap : 11 GB (also on HDD — DO NOT LET ANYTHING TOUCH IT)
#
# Memory budget (hard limits must never trigger swap):
#   postgres         : 3500M  (shared_buffers 512MB — safe for HDD)
#   redis            :  700M
#   backend          : 2500M
#   worker-backtests : 3500M
#   worker-uploads   :  500M
#   cron-warmup      :   50M
#   frontend         :  200M
#   intraday-api     :  512M
#   ─────────────────────────────
#   worker-optimize  : 4096M  (profile-gated; replaces 3200M — see comment below)
#   ─────────────────────────────
#   Total hard limit : 11,462M (default stack; +4096M when optimize profile active)
#   OS + kernel      : ~1,500M
#   Headroom/cache   : ~3,600M  ← HDD needs large OS page cache
#   ─────────────────────────────
#   Grand total      : ~16,000M  ✓ fits with buffer
#
# HDD-specific Postgres tuning:
#   - random_page_cost=4.0   (HDD random I/O is 4x more expensive than seq)
#   - effective_io_concurrency=2  (NOT 100 — HDD can't do parallel I/O)
#   - shared_buffers=512MB   (keep more in Postgres cache to avoid disk reads)
#   - effective_cache_size=2GB  (realistic for 16GB with HDD)
#   - work_mem=32MB          (low — 6 parallel workers × 32MB = 192MB max)
#   - max_parallel_workers=2  (HDD bottleneck means more workers = slower)
# ============================================================

x-backend-env: &backend-env
  DATABASE_URL: "postgresql://${POSTGRES_USER:-algotest}:${POSTGRES_PASSWORD:-algotest_password}@postgres:5432/${POSTGRES_DB:-algotest}"
  REDIS_URL: "redis://redis:6379/0"
  DATA_DIR: /data
  PYTHONUNBUFFERED: "1"
  MALLOC_ARENA_MAX: "2"
  DB_POOL_SIZE: "5"
  DB_POOL_MAX_OVERFLOW: "5"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "3600"
  # Cap in-process bulk_load so backend+worker never OOM on 16GB HDD server
  BULK_LOAD_MAX_MEMORY_MB: "1500"
  # Max Rust AHashMap cache size (feather_MB × 5 estimate). Raised to 3000 because
  # OHLC columns (added for MAE/MFE) grew the feather from ~275 MB to ~575 MB;
  # 575×5=2875 MB exceeds the old 2500 MB cap, causing the Rust cache to be
  # skipped and an 8.4M-row Python fallback dict build that never finishes.
  # Actual peak usage is ~2770 MB (within the 3500 MB Docker worker limit).
  RUST_CACHE_MAX_MEMORY_MB: "3000"
  # NIFTY bulk loads are narrow (date/expiry/type/strike/close), so avoid
  # splitting normal 6-7 year backtests into repeated DB+engine passes.
  BULK_LOAD_CHUNK_YEARS: "10"
  # Keep startup responsive on HDD. Real backtest requests load their own range.
  PREBUILD_BULK_OPTIONS: "0"
  # Warm enough history to cover the long 2019+ runs used by the team.
  PREBUILD_WARM_YEARS: "8"
  # Tradesheet includes MAE/MFE by default; set to 0 only for bulk performance tests.
  BACKTEST_INCLUDE_MAE_MFE: "1"
  # Persist hot caches across container recreates.
  PARQUET_CACHE_DIR: /data/cache/parquet
  ALGO_RUST_CACHE_DIR: /data/cache/arrow
  # Avoid expensive native-cache setup for short expiry-only runs.
  FAST_LOOKUP_MODE: auto
  FAST_LOOKUP_MIN_YEARS: "2.0"
  FAST_LOOKUP_RANGE_FILTER: "0"
  FAST_LOOKUP_NATIVE_SCANS: "1"
  # Route small ranges to a separate worker so they do not wait behind a long run.
  BACKTEST_FAST_QUEUE_MAX_DAYS: "550"
  # API warm-cache waits for the Celery worker cache, not only backend memory.
  WARM_CACHE_WAIT_SECONDS: "90"
  # Try Rust engine for supported strategies (slices 1-5); auto-falls back to
  # Python for buffer/futures/lazy/rollover/no-rollover/min_days/fixed-mode legs.
  ENGINE_BACKEND: "rust"

x-backend-volumes: &backend-volumes
  - ./cleaned_csvs:/data/cleaned_csvs:ro
  - ./expiryData:/data/expiryData:ro
  - ./strikeData:/data/strikeData:ro
  - ./Filter:/data/Filter:ro
  - algo_cache:/data/cache
  # Bind-mount backend source so .py edits on host hot-reload into containers
  # without rebuilding the image. The Rust extension is loaded from
  # /usr/local/lib/python3.11/site-packages, not from /app/native, so this is safe.
  - ./backend:/app

services:
  postgres:
    image: postgres:15-bullseye
    container_name: algotest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algotest}
      POSTGRES_USER: ${POSTGRES_USER:-algotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algotest_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./reports/sql:/data:ro
    shm_size: '512mb'
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=4.0
      -c effective_io_concurrency=2
      -c max_worker_processes=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_workers=2
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
      -c log_min_duration_statement=2000
      -c idle_in_transaction_session_timeout=600000
      -c statement_timeout=1800000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algotest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3500M
          cpus: "2.0"
        reservations:
          memory: 1500M
    networks:
      - algotest-network

  redis:
    image: redis:7-bullseye
    container_name: algotest-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 500mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-keepalive 60
      --timeout 300
    environment:
      REDIS_PASSWORD: ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 700M
          cpus: "0.5"
        reservations:
          memory: 64M
    networks:
      - algotest-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # provenance attestation is a Docker Hub SBOM feature; locally it
      # adds 5-7 minutes to every rebuild and we don't use it. Off.
      provenance: false
    image: algotest-backend-app:latest
    container_name: algotest-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command:
      - granian
      - --interface
      - asgi
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"
      - --loop
      - uvloop
      - main:app
    environment:
      <<: *backend-env
      DB_STATEMENT_TIMEOUT: "1800000"
      USE_POSTGRESQL: "true"
      ALLOW_CSV_FALLBACK: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-algotest}
      POSTGRES_USER: ${POSTGRES_USER:-algotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algotest_password}
      OPTIMIZE_PARALLELISM: "2"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health'); print(r.read())"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2500M
          cpus: "2.0"
        reservations:
          memory: 256M
    networks:
      - algotest-network

  worker-backtests:
    image: algotest-backend-app:latest
    container_name: algotest-worker-backtests
    restart: unless-stopped
    command: >
      celery -A worker.celery worker
      --queues=backtests
      --concurrency=1
      -l info
      --max-memory-per-child=3200000
      --without-gossip
      --without-mingle
      --without-heartbeat
    environment:
      <<: *backend-env
      BACKTEST_WORKERS: "1"
      BULK_LOAD_MAX_MEMORY_MB: "1500"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 5000M
          cpus: "4.0"
        reservations:
          memory: 512M
    networks:
      - algotest-network

  worker-backtests-fast:
    image: algotest-backend-app:latest
    container_name: algotest-worker-backtests-fast
    restart: unless-stopped
    command: >
      celery -A worker.celery worker
      --queues=backtests_fast
      --concurrency=1
      -l info
      --max-memory-per-child=3200000
      --without-gossip
      --without-mingle
      --without-heartbeat
    environment:
      <<: *backend-env
      BACKTEST_WORKERS: "1"
      BULK_LOAD_MAX_MEMORY_MB: "900"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 5000M
          cpus: "2.0"
        reservations:
          memory: 256M
    networks:
      - algotest-network

  worker-optimize:
    # Profile-gated: not started by `docker compose up`. Bring up with:
    #   docker compose --profile optimize up -d worker-optimize
    # Shares the same image as worker-backtests; runs an exclusive 'optimize' queue
    # so long parameter sweeps don't block normal backtests.
    #
    # concurrency=3: 3 simultaneous optimize jobs (one per user).
    # Memory math per job with P=2 (fork start method, CoW AHashMap sharing):
    #   - Coordinator: ~700MB (Rust cache 1680MB loaded then kept for CoW fork)
    #   - 2 fork workers: inherit AHashMap via CoW (shared pages, ~0 extra RAM)
    #     + Python working memory ~300MB each = ~600MB total
    #   - Per-job total: ~1300MB
    #   - 3 concurrent jobs: 3 × 1300MB = 3.9GB  →  within 4096M
    #   NOTE: old forkserver path rebuilt 1680MB AHashMap per child → OOM.
    profiles: ["optimize"]
    image: algotest-backend-app:latest
    container_name: algotest-worker-optimize
    restart: unless-stopped
    command: >
      celery -A worker.celery worker
      --queues=optimize
      --concurrency=3
      -l info
      --max-memory-per-child=2800000
      --without-gossip
      --without-mingle
      --without-heartbeat
    environment:
      <<: *backend-env
      BACKTEST_WORKERS: "1"
      OPTIMIZE_MAX_COMBOS: "100000"
      # P=2: 2 billiard fork workers per job. Children inherit the parent's
      # Rust AHashMap via CoW (1680MB shared, not duplicated). Safe with
      # concurrency=3 — total RSS stays within 4096M.
      # FAST_LOOKUP_RANGE_FILTER=0: always use full feather (575MB on disk)
      # instead of a range-specific feather that may not exist → avoids 2-3 min
      # DB fallback. Full feather loads in ~6s cold / <1s warm from page cache.
      OPTIMIZE_PARALLELISM: "2"
      OPTIMIZE_SKIP_MAE_MFE: "0"
      OPTIMIZE_SKIP_TRADESHEETS: "0"
      FAST_LOOKUP_RANGE_FILTER: "0"
      # Fork-safe threading for the optimizer worker.
      # POLARS_MAX_THREADS=1: keep Polars single-threaded in the parent so
      # its global rayon pool has ≤1 thread before forking — Polars ops in
      # children degrade gracefully to sequential rather than deadlocking.
      # RUST_SIM_THREADS=4: thread count for the process-local rayon pools
      # (SIM_POOL in simulate.rs, OPTIM_POOL in optimizer.rs). These pools
      # are Lazy<ThreadPool> singletons that are NOT initialized in the parent
      # — each forked child creates its own fresh pool on first use, so there
      # are no dead inherited threads. RAYON_NUM_THREADS is intentionally
      # unset; the global rayon pool is never used by the engine.
      POLARS_MAX_THREADS: "1"
      RUST_SIM_THREADS: "4"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # 4096M: 3 concurrent jobs × ~800MB each = 2.4GB + 1.6GB headroom.
          # Feather mmap is shared (OS page cache) so memory does NOT multiply
          # with each additional concurrent job.
          # 8 CPUs: 3 jobs × 2 forkserver workers = 6 active Python processes;
          # 8 gives headroom for Celery coordinators + Rust rayon threads.
          memory: 4096M
          cpus: "8.0"
        reservations:
          memory: 256M
    networks:
      - algotest-network

  worker-uploads:
    image: algotest-backend-app:latest
    container_name: algotest-worker-uploads
    restart: unless-stopped
    command: >
      celery -A worker.celery worker
      -Q uploads
      -c 1
      -l info
      --max-memory-per-child=300000
      --without-gossip
      --without-mingle
      --without-heartbeat
    environment:
      <<: *backend-env
      INTRADAY_DATA_DIR: /data/intraday
    volumes:
      - ./cleaned_csvs:/data/cleaned_csvs:ro
      - ./expiryData:/data/expiryData:ro
      - ./strikeData:/data/strikeData:ro
      - ./Filter:/data/Filter:ro
      - algo_cache:/data/cache
      - algo_cache:/data/intraday
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.vmtouch-warmup.schedule: "0 30 0 * * *"
      ofelia.job-exec.vmtouch-warmup.command: "/app/scripts/vmtouch_warmup.sh"
    deploy:
      resources:
        limits:
          memory: 500M
          cpus: "0.5"
        reservations:
          memory: 128M
    networks:
      - algotest-network

  cron-warmup:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - worker-uploads
    deploy:
      resources:
        limits:
          memory: 50M
          cpus: "0.1"
    networks:
      - algotest-network

  worker-backtests-intraday:
    image: algotest-backend-app:latest
    container_name: algotest-worker-backtests-intraday
    restart: unless-stopped
    command: >
      celery -A worker.celery worker
      --queues=backtests_intraday
      --concurrency=3
      -l info
      --max-memory-per-child=2200000
      --without-gossip --without-mingle --without-heartbeat
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2500M
          cpus: "3.0"
        reservations:
          memory: 512M
    networks:
      - algotest-network

  worker-backtests-intraday-slow:
    image: algotest-backend-app:latest
    container_name: algotest-worker-backtests-intraday-slow
    restart: unless-stopped
    command: >
      celery -A worker.celery worker
      --queues=backtests_intraday_slow
      --concurrency=1
      -l info
      --max-memory-per-child=1300000
      --without-gossip --without-mingle --without-heartbeat
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1500M
          cpus: "1.5"
        reservations:
          memory: 256M
    networks:
      - algotest-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algotest-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pkill -0 nginx || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "0.5"
        reservations:
          memory: 64M
    networks:
      - algotest-network

  intraday-api:
    build:
      context: ./backend/intraday_server
      dockerfile: Dockerfile
      network: host
      secrets:
        - ca_bundle
    ports:
      - "8001:8001"
    environment:
      INTRADAY_DATA_DIR: /data/intraday
      REDIS_URL: redis://redis:6379/0
      RUST_LOG: info
    volumes:
      - algo_cache:/data
      - /data/intraday:/data/intraday
    depends_on:
      - redis
    restart: unless-stopped
    container_name: algotest-intraday-api
    networks:
      - algotest-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8001; printf \"GET /api/intraday/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r line <&3; [[ $$line == *\"200 OK\"* ]]'"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "4.0"
        reservations:
          memory: 128M

volumes:
  pgdata:
  redis_data:
  parquet_cache:
  algo_cache:

secrets:
  ca_bundle:
    file: /etc/ssl/certs/ca-certificates.crt

networks:
  algotest-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================
# Tuned for: Dell Pro Tower QCT1250  (migrated from HP 280 Pro G6 in 2026-06)
#   CPU  : Intel Core i5-14500  (14C/20T, 20 logical CPUs)
#   RAM  : 16 GB DDR5  (≈14.8 GiB usable) — FIXED, no upgrade planned.
#          Board has 2 DDR5 UDIMM slots / max 64 GB, but the user is staying at
#          16 GB, so the budget below MUST live within ~14.8 GiB RAM + swap.
#   DISK : KIOXIA 512 GB NVMe SSD  ← SSD now, NOT a spinning HDD.
#   OS   : Ubuntu 26.04 (Linux 7.0)
#   Swap : 24 GB on the NVMe SSD  ← safe to use as overflow (SSD, ~100x faster
#          than the old HDD). This swap is the cushion that absorbs the
#          intentional overcommit below; it is NOT off-limits like the old HDD swap.
#
# *** MEMORY REALITY ON THIS 16 GB BOX — READ BEFORE CHANGING LIMITS ***
#   The hard limits below SUM TO ~17,400M (default stack) and therefore
#   intentionally OVERCOMMIT the 14.8 GiB of RAM. This is only safe because:
#     (a) the two 5 GB backtest workers each hold ~3.9 GB just for their own
#         Rust/Arrow NIFTY cache (much of it mmap'd, cheap to page from SSD), and
#         a solo user rarely runs a heavy job on BOTH at the same instant; and
#     (b) the 24 GB SSD swap absorbs any spillover cheaply.
#   The old HDD machine froze (swap thrash) when this overcommit hit; on the new
#   NVMe SSD the same pressure degrades gracefully instead of rebooting the PC.
#
#   *** NO-OOM ENFORCEMENT (added 2026-06): a memory ADMISSION GATE now bounds
#   the combined memory of concurrently *active* heavy jobs to HEAVY_MEMORY_BUDGET_MB
#   (7000M). A job that doesn't fit WAITS (status "queued") instead of overcommitting.
#   So the per-container limits above are ceilings, but the gate is what actually
#   keeps the live working set within RAM. The old "RULE: don't run optimize + two
#   backtests" is now ENFORCED by the gate, not left to the user. Idle warm caches
#   page to SSD swap and don't count against the active budget.
#   FAST_LOOKUP_MODE=rust is on: lookups are Rust-only (no Python dict fallback);
#   the gate + swap are the memory backstop for the uncapped native cache load.
#   See services/memory_gate.py. Retune via HEAVY_* env vars; revert with
#   HEAVY_MEMORY_GATE=0 and FAST_LOOKUP_MODE=auto.
#
# Per-container hard limits (default stack):
#   postgres                       : 3500M
#   redis                          :  700M
#   backend                        : 2500M
#   worker-backtests               : 5000M  (own ~3.9 GB Rust cache)
#   worker-backtests-fast          : 5000M  (own ~3.9 GB Rust cache)
#   worker-uploads                 :  500M
#   frontend                       :  200M
#   ───────────────────────────────────────
#   Sum (default stack)            : 17,400M   (+10,000M when worker-optimize active)
#   Host RAM                       : ~15,160M (14.8 GiB)
#   → The default stack overcommits modestly; the optimize worker (profile-gated)
#     adds 10,000M when running 2 concurrent optimize jobs (concurrency=2, P=3).
#     This deliberately overcommits 16 GB onto the 24 GB NVMe swap. The memory
#     ADMISSION GATE (HEAVY_MEMORY_BUDGET_MB=14000) bounds total ACTIVE heavy
#     work — 2 optims + 1 backtest run together, a 4th heavy job QUEUES — so the
#     overcommit can never exhaust RAM+swap (no OOM). All workers mmap-SHARE one
#     copy of the OHLC feather, so real RAM is far below the per-container sums.
#     (Intraday is a separate product — its workers/api + the intraday-only
#     cron-warmup were removed, reclaiming ~4.5 GB for this headroom.)
#
# SSD-specific Postgres tuning (was HDD-tuned before the 2026-06 migration):
#   - random_page_cost=1.1   (NVMe random reads are ~as cheap as sequential)
#   - effective_io_concurrency=200  (SSD does deep parallel I/O; the HDD could not)
#   - shared_buffers=512MB / effective_cache_size=2GB  (kept modest — only 16 GB RAM)
#   - work_mem=32MB, max_parallel_workers=2  (kept low to protect the RAM budget,
#     not because of disk — CPU now has 20 threads to spare)
# ============================================================

x-backend-env: &backend-env
  DATABASE_URL: "postgresql://${POSTGRES_USER:-algotest}:${POSTGRES_PASSWORD:-algotest_password}@postgres:5432/${POSTGRES_DB:-algotest}"
  REDIS_URL: "redis://redis:6379/0"
  DATA_DIR: /data
  PYTHONUNBUFFERED: "1"
  MALLOC_ARENA_MAX: "2"
  DB_POOL_SIZE: "5"
  DB_POOL_MAX_OVERFLOW: "5"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "3600"
  # Cap in-process bulk_load so backend+worker never OOM on 16GB HDD server
  BULK_LOAD_MAX_MEMORY_MB: "1500"
  # Max Rust AHashMap cache size (feather_MB × 5 estimate). Raised to 4000 on
  # 2026-05-25 because the FUTURES port grew the feather from ~575 MB → 706 MB;
  # 706×5=3530 MB exceeds the old 3000 MB cap, causing the Rust cache to be
  # skipped → Python/Polars fallback → 7 GB host swap and stuck optimize jobs.
  # Pair with worker-optimize mem_limit (see budget header). f32 cache ~2.6 GB.
  RUST_CACHE_MAX_MEMORY_MB: "4000"
  # NIFTY bulk loads are narrow (date/expiry/type/strike/close), so avoid
  # splitting normal 6-7 year backtests into repeated DB+engine passes.
  BULK_LOAD_CHUNK_YEARS: "10"
  # Keep startup responsive on HDD. Real backtest requests load their own range.
  PREBUILD_BULK_OPTIONS: "0"
  # Warm enough history to cover the long 2019+ runs used by the team.
  PREBUILD_WARM_YEARS: "8"
  # Tradesheet includes MAE/MFE by default; set to 0 only for bulk performance tests.
  BACKTEST_INCLUDE_MAE_MFE: "1"
  # Persist hot caches across container recreates.
  PARQUET_CACHE_DIR: /data/cache/parquet
  ALGO_RUST_CACHE_DIR: /data/cache/arrow
  # FAST_LOOKUP_MODE=rust: strict Rust-only lookups. The native cache is ALWAYS
  # built and NEVER falls back to the Python dict — a missing/unbuildable native
  # cache raises a clear error instead of silently running the slow path. Memory
  # safety comes from the admission gate below + SSD swap, not from skipping to
  # Python. Set back to 'auto' to restore Rust-preferred + Python fallback.
  FAST_LOOKUP_MODE: rust
  FAST_LOOKUP_MIN_YEARS: "2.0"
  FAST_LOOKUP_RANGE_FILTER: "0"
  FAST_LOOKUP_NATIVE_SCANS: "1"
  # ── Memory admission gate (no-OOM) ──────────────────────────────────────────
  # Bounds the combined memory of concurrently *active* heavy jobs so they can
  # never overcommit RAM. A job that doesn't fit waits (status shows "queued")
  # until a running job releases its slot. Idle warm caches page to SSD swap and
  # don't count. Pure orchestration — see services/memory_gate.py (no math touched).
  HEAVY_MEMORY_GATE: "1"
  # Sized for: 2 concurrent optimize jobs (@ ~4500 each, P=3) + 1 backtest (5000)
  # = 14000, so a backtest never queues behind optims. The gate still QUEUES a
  # 4th heavy job (no overcommit); 24 GB NVMe swap is the final backstop. Real
  # RAM is well under 14000 because all workers mmap-SHARE one copy of the OHLC
  # feather (only the per-job f32 AHashMap ~2.6 GB is duplicated).
  HEAVY_MEMORY_BUDGET_MB: "14000"
  HEAVY_COST_BACKTEST_MB: "5000"
  HEAVY_COST_OPTIMIZE_MB: "4500"          # one optimize job at P=3 (was 6000 at P=6)
  HEAVY_GATE_WAIT_MAX_SECONDS: "600"      # then proceed anyway (SSD swap backstop)
  HEAVY_RESERVATION_TTL_SECONDS: "2400"   # auto-reclaim a crashed/cancelled slot
  # Route small ranges to a separate worker so they do not wait behind a long run.
  BACKTEST_FAST_QUEUE_MAX_DAYS: "550"
  # API warm-cache waits for the Celery worker cache, not only backend memory.
  WARM_CACHE_WAIT_SECONDS: "90"
  # Try Rust engine for supported strategies (slices 1-5); auto-falls back to
  # Python for buffer/futures/lazy/rollover/no-rollover/min_days/fixed-mode legs.
  ENGINE_BACKEND: "rust"

x-backend-volumes: &backend-volumes
  - ./cleaned_csvs:/data/cleaned_csvs:ro
  - ./expiryData:/data/expiryData:ro
  - ./strikeData:/data/strikeData:ro
  - ./Filter:/data/Filter:ro
  - algo_cache:/data/cache
  # Bind-mount backend source so .py edits on host hot-reload into containers
  # without rebuilding the image. The Rust extension is loaded from
  # /usr/local/lib/python3.11/site-packages, not from /app/native, so this is safe.
  - ./backend:/app

services:
  postgres:
    image: postgres:15-bullseye
    container_name: algotest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algotest}
      POSTGRES_USER: ${POSTGRES_USER:-algotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algotest_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./reports/sql:/data:ro
    shm_size: '512mb'
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_worker_processes=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_workers=2
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
      -c log_min_duration_statement=2000
      -c idle_in_transaction_session_timeout=600000
      -c statement_timeout=1800000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algotest}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3500M
          cpus: "2.0"
        reservations:
          memory: 1500M
    networks:
      - algotest-network

  redis:
    image: redis:7-bullseye
    container_name: algotest-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 500mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-keepalive 60
      --timeout 300
    environment:
      REDIS_PASSWORD: ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 700M
          cpus: "0.5"
        reservations:
          memory: 64M
    networks:
      - algotest-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # provenance attestation is a Docker Hub SBOM feature; locally it
      # adds 5-7 minutes to every rebuild and we don't use it. Off.
      provenance: false
    image: algotest-backend-app:latest
    container_name: algotest-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command:
      - granian
      - --interface
      - asgi
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"
      - --loop
      - uvloop
      - main:app
    environment:
      <<: *backend-env
      DB_STATEMENT_TIMEOUT: "1800000"
      USE_POSTGRESQL: "true"
      ALLOW_CSV_FALLBACK: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-algotest}
      POSTGRES_USER: ${POSTGRES_USER:-algotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algotest_password}
      OPTIMIZE_PARALLELISM: "2"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health'); print(r.read())"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2500M
          cpus: "2.0"
        reservations:
          memory: 256M
    networks:
      - algotest-network

  worker-backtests:
    image: algotest-backend-app:latest
    container_name: algotest-worker-backtests
    restart: unless-stopped
    command: >
      celery -A worker.celery worker
      --queues=backtests
      --concurrency=1
      -l info
      --max-memory-per-child=5000000
      --without-gossip
      --without-mingle
      --without-heartbeat
    environment:
      <<: *backend-env
      BACKTEST_WORKERS: "1"
      BULK_LOAD_MAX_MEMORY_MB: "1500"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 5000M
          cpus: "4.0"
        reservations:
          memory: 512M
    networks:
      - algotest-network

  worker-backtests-fast:
    image: algotest-backend-app:latest
    container_name: algotest-worker-backtests-fast
    restart: unless-stopped
    command: >
      celery -A worker.celery worker
      --queues=backtests_fast
      --concurrency=1
      -l info
      --max-memory-per-child=5000000
      --without-gossip
      --without-mingle
      --without-heartbeat
    environment:
      <<: *backend-env
      BACKTEST_WORKERS: "1"
      BULK_LOAD_MAX_MEMORY_MB: "900"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 5000M
          cpus: "2.0"
        reservations:
          memory: 256M
    networks:
      - algotest-network

  worker-optimize:
    # Profile-gated: not started by `docker compose up`. Bring up with:
    #   docker compose --profile optimize up -d worker-optimize
    # Shares the same image as worker-backtests; runs an exclusive 'optimize' queue
    # so long parameter sweeps don't block normal backtests.
    #
    # concurrency=2: TWO optimize jobs at a time (results stay isolated per
    # job_id — separate processes, separate optim:{job_id}:* keys + trade dirs).
    # In-job parallelism HALVED to OPTIMIZE_PARALLELISM=3 so 2 jobs ≈ the CPU of
    # one old P=6 job. Per-job memory at P=3 (billiard fork + CoW sharing):
    #   - Rust AHashMap (f32): ~2.6 GB  (per JOB — duplicated across the 2 jobs)
    #   - pandas ohlc_df_pandas: ~75 MB (CoW-inherited by workers)
    #   - Python/Celery overhead: ~500 MB
    #   - 3 workers × ~400 MB private pages: ~1.2 GB
    #   - Per job ≈ 4.3 GB → 2 jobs ≈ 8.6 GB (OHLC feather is mmap-shared, +~0.5)
    # mem_limit raised to 10000M to hold both jobs (clean mmap pages reclaim
    # first under pressure; cgroup won't OOM a job). Host impact when both run:
    # ~9.5 GB optimizer + backtest (shares the OHLC mmap) + ~3 GB desktop +
    # the separate intraday server — overcommits 16 GB onto the 24 GB NVMe swap;
    # the memory gate caps total ACTIVE heavy work so it can never exhaust swap.
    profiles: ["optimize"]
    image: algotest-backend-app:latest
    container_name: algotest-worker-optimize
    restart: unless-stopped
    command: >
      celery -A worker.celery worker
      --queues=optimize
      --concurrency=2
      -l info
      --max-memory-per-child=5000000
      --without-gossip
      --without-mingle
      --without-heartbeat
    environment:
      <<: *backend-env
      # PYTHONOPTIMIZE=1 (override): the base image sets =2 (strips docstrings)
      # which breaks the `cma` library that nevergrad lazy-imports for
      # CMA-ES / PSO / GA optimization methods. =1 still strips asserts (same
      # behavior as today) but keeps docstrings so cma's module-level
      # `plot.__doc__.split(...)` doesn't crash. Smart-sampler optims would
      # crash with `'NoneType' object has no attribute 'split'` otherwise.
      PYTHONOPTIMIZE: "1"
      BACKTEST_WORKERS: "1"
      OPTIMIZE_MAX_COMBOS: "100000"
      # P=3: 3 billiard fork workers share the Rust AHashMap via CoW.
      # Halved from 6 so 2 concurrent jobs (concurrency=2) use roughly the CPU/RAM
      # of one old P=6 job. Each worker adds ~400 MB private pages.
      OPTIMIZE_PARALLELISM: "3"
      # Keep MAE/MFE enabled so optimizer master-summary "Actual Live DD"
      # matches the downloaded tradesheet Summary sheet. If disabled, optimizer
      # summary falls back to booked DD/%DD while tradesheet downloads are
      # enriched later, causing the two summaries to disagree.
      OPTIMIZE_SKIP_MAE_MFE: "0"
      OPTIMIZE_SKIP_TRADESHEETS: "0"
      FAST_LOOKUP_RANGE_FILTER: "0"
      # Fork-safe threading for the optimizer worker.
      # POLARS_MAX_THREADS=1: keep Polars single-threaded in the parent so
      # its global rayon pool has ≤1 thread before forking — Polars ops in
      # children degrade gracefully to sequential rather than deadlocking.
      # RUST_SIM_THREADS=4: thread count for the process-local rayon pools
      # (SIM_POOL in simulate.rs, OPTIM_POOL in optimizer.rs). These pools
      # are Lazy<ThreadPool> singletons that are NOT initialized in the parent
      # — each forked child creates its own fresh pool on first use, so there
      # are no dead inherited threads. RAYON_NUM_THREADS is intentionally
      # unset; the global rayon pool is never used by the engine.
      POLARS_MAX_THREADS: "1"
      RUST_SIM_THREADS: "4"
    user: "0:0"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # 10000M: holds TWO concurrent optimize jobs at P=3. Each job ≈ 4.3 GB
          # (f32 AHashMap ~2.6 GB + Python/Celery ~0.5 GB + 3 workers × 0.4 GB),
          # the OHLC feather is mmap-shared (counted once) → ~8.6 GB + headroom.
          # Clean mmap pages reclaim under cgroup pressure before any OOM.
          # cpus 8.0: 2 jobs × 3 billiard workers + parents. Updated 2026-06-24.
          memory: 10000M
          cpus: "8.0"
        reservations:
          memory: 256M
    networks:
      - algotest-network

  worker-uploads:
    image: algotest-backend-app:latest
    container_name: algotest-worker-uploads
    restart: unless-stopped
    command: >
      celery -A worker.celery worker
      -Q uploads
      -c 1
      -l info
      --max-memory-per-child=300000
      --without-gossip
      --without-mingle
      --without-heartbeat
    environment:
      <<: *backend-env
    volumes:
      - ./cleaned_csvs:/data/cleaned_csvs:ro
      - ./expiryData:/data/expiryData:ro
      - ./strikeData:/data/strikeData:ro
      - ./Filter:/data/Filter:ro
      - algo_cache:/data/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 500M
          cpus: "0.5"
        reservations:
          memory: 128M
    networks:
      - algotest-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algotest-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pkill -0 nginx || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "0.5"
        reservations:
          memory: 64M
    networks:
      - algotest-network

volumes:
  pgdata:
  redis_data:
  parquet_cache:
  algo_cache:

secrets:
  ca_bundle:
    file: /etc/ssl/certs/ca-certificates.crt

networks:
  algotest-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

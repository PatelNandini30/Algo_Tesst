[workspace]
members = [
    "crates/domain",
    "crates/engine",
    "crates/optimizer",
    "crates/parity",
    "crates/api",
    "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
axum = "0.7.9"
chrono = { version = "0.4.44", features = ["serde"] }
csv = "1.4"
rayon = "1.10"
rust_xlsxwriter = "0.79.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
